name: Verify GITA
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node scripts/check-arrival.mjs
      - run: npm run check:release
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all fetched history
        run: '"${{ runner.temp }}/gitleaks" git . --log-opts=--all --redact=100 --max-archive-depth=4 --max-decode-depth=3 --no-banner'
      - name: Scan current tracked files and bundled archives
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/gita-scan"
          git archive HEAD | tar -x -C "${{ runner.temp }}/gita-scan"
          "${{ runner.temp }}/gitleaks" dir "${{ runner.temp }}/gita-scan" --redact=100 --max-archive-depth=4 --max-decode-depth=3 --no-banner
